<style>
  :root {
    --bg: #fff; --sheet: #fff; --card: #f6f6f6; --card2: #ececec;
    --text: #111; --muted: #888; --line: #eee;
    --pink: #fe2c55; --cyan: #25f4ee; --gold: #ffc53d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; min-height: 100vh; }
  .phone { width: 100%; max-width: 420px; min-height: 100vh; position: relative; overflow: hidden; background: var(--bg); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  /* Üst sekmeler */
  .tabs { display: flex; justify-content: center; gap: 28px; padding: calc(14px + env(safe-area-inset-top)) 16px 0; position: relative; z-index: 5; }
  .tab { padding: 8px 0; color: var(--muted); font-weight: 600; font-size: 16px; border-bottom: 2px solid transparent; }
  .tab.active { color: var(--text); border-color: var(--text); }
  .screen { display: none; }
  .screen.active { display: block; }

  /* Coin ikonu */
  .coin { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe58f, #faad14 60%, #d48806); color: #7a4a00; font-size: 10px; font-weight: 800; flex: none; }
  .coin.lg { width: 34px; height: 34px; font-size: 18px; }

  /* ---------- YÜKLEME ---------- */
  .recharge { padding: 16px 16px 120px; }
  .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .head h1 { font-size: 17px; font-weight: 700; flex: 1; text-align: center; }
  .icon-btn { width: 32px; height: 32px; display: grid; place-items: center; font-size: 20px; }
  .balance-card { background: linear-gradient(135deg, #fff7e6, #fff); border: 1px solid #ffe7ba; border-radius: 14px; padding: 16px; display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .balance-card small { color: var(--muted); font-size: 13px; display: block; }
  .balance-card strong { font-size: 26px; font-weight: 800; }
  .section-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .section-title span { color: var(--muted); font-weight: 400; font-size: 12px; }
  .packages { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px; }
  .pkg { background: var(--card); border: 1.5px solid transparent; border-radius: 10px; padding: 14px 6px 12px; text-align: center; position: relative; transition: .15s; }
  .pkg .amt { display: flex; align-items: center; justify-content: center; gap: 5px; font-weight: 700; font-size: 16px; margin-bottom: 6px; }
  .pkg .price { color: var(--muted); font-size: 13px; }
  .pkg.selected { border-color: var(--pink); background: #fff0f3; }
  .pkg .badge { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); background: var(--pink); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 6px; white-space: nowrap; }
  .pkg.custom .amt { font-size: 14px; }
  .methods { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .method { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 10px; padding: 14px; text-align: left; }
  .method .mi { width: 34px; height: 24px; border-radius: 4px; background: var(--card2); display: grid; place-items: center; font-size: 14px; }
  .method .ml { flex: 1; font-size: 14px; }
  .radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #ccc; display: grid; place-items: center; }
  .method.selected .radio { border-color: var(--pink); }
  .method.selected .radio::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--pink); }
  .note { color: var(--muted); font-size: 11px; line-height: 1.5; }
  .bottom-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 420px; background: var(--sheet); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 12px; z-index: 10; }
  .bottom-bar .total { flex: 1; }
  .bottom-bar .total small { color: var(--muted); font-size: 12px; display: block; }
  .bottom-bar .total strong { font-size: 18px; }
  .btn-primary { background: var(--pink); color: #fff; font-weight: 700; font-size: 15px; padding: 13px 28px; border-radius: 6px; }
  .btn-primary:disabled { opacity: .4; }

  /* ---------- COİN GÖNDER ---------- */
  .send { background: #fff; color: #111; min-height: calc(100vh - 50px); padding: 20px 16px 40px; }
  .send-bal { display: flex; align-items: center; gap: 8px; background: #f6f6f6; border-radius: 12px; padding: 14px; margin-bottom: 22px; }
  .send-bal small { color: #888; font-size: 13px; }
  .send-bal strong { font-size: 18px; margin-left: 2px; }
  .recharge-link { margin-left: auto; color: var(--pink) !important; font-weight: 600; font-size: 14px; }
  .field-label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 8px; }
  .recipient-in { display: flex; align-items: center; gap: 4px; background: #f6f6f6; border: 1.5px solid transparent; border-radius: 10px; padding: 0 12px; margin-bottom: 22px; }
  .recipient-in:focus-within { border-color: #111; }
  .recipient-in.err { border-color: var(--pink); }
  .recipient-in span { color: #888; font-size: 16px; }
  .recipient-in input, .amount-in input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: #000; font-size: 16px; padding: 13px 0; }
  .amounts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
  .amt-btn { display: flex; align-items: center; justify-content: center; gap: 6px; background: #f6f6f6; border: 1.5px solid transparent; border-radius: 10px; padding: 14px 4px; font-weight: 700; font-size: 15px; color: #111 !important; }
  .amt-btn.selected { border-color: var(--pink); background: #fff0f3; }
  .amount-in { display: flex; align-items: center; gap: 8px; background: #f6f6f6; border: 1.5px solid transparent; border-radius: 10px; padding: 0 12px; margin-bottom: 22px; }
  .amount-in.active { border-color: var(--pink); background: #fff0f3; }
  .send-summary { border: 1px solid #eee; border-radius: 12px; padding: 4px 14px; margin-bottom: 18px; }
  .send-summary .row { border-color: #eee; }
  .send-summary .row:last-child { border: 0; }
  .send-summary .row span:first-child { color: #888; }
  .send-summary .row.neg span:last-child { color: var(--pink); }
  .send .btn-primary { width: 100%; padding: 15px; font-size: 16px; color: #fff !important; }

  /* Modal / toast */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 50; display: none; align-items: flex-end; justify-content: center; }
  .modal-bg.show { display: flex; }
  .modal { width: 100%; max-width: 420px; background: var(--sheet); box-shadow: 0 -4px 24px rgba(0,0,0,.08); border-radius: 14px 14px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); animation: up .25s ease-out; }
  .modal h3 { font-size: 16px; text-align: center; margin-bottom: 16px; }
  .row { display: flex; justify-content: space-between; padding: 10px 0; font-size: 14px; border-bottom: 1px solid var(--line); }
  .row span:first-child { color: var(--muted); }
  .modal .btn-primary { width: 100%; margin-top: 18px; padding: 14px; }
  .modal .cancel { width: 100%; margin-top: 8px; padding: 12px; color: var(--muted); }
  .success { text-align: center; padding: 10px 0; }
  .success .check { width: 64px; height: 64px; border-radius: 50%; background: #f0fbe8; color: #52c41a; font-size: 34px; display: grid; place-items: center; margin: 0 auto 14px; }
  .toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: rgba(30,30,30,.92); color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 14px; z-index: 60; opacity: 0; transition: .2s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }
  input.custom-in { width: 100%; background: var(--card); border: 1px solid var(--line); color: #000; border-radius: 8px; padding: 14px; font-size: 18px; text-align: center; outline: 0; }
  input { color: #000; caret-color: #000; -webkit-text-fill-color: #000; }
  input::placeholder { color: #aaa; -webkit-text-fill-color: #aaa; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-60px); } }
  @keyframes up { from { transform: translateY(100%); } }
</style>
</head>

      <div class="send-summary" id="sendSummary"></div>
      <button class="btn-primary" id="sendBtn">Gönder</button>
    </div>
  </section>
</div>

const PACKAGES = [
  { c: 70, p: 22.99 }, { c: 350, p: 109.99 }, { c: 700, p: 219.99 },
  { c: 1400, p: 439.99 }, { c: 3500, p: 1099.99, badge: "Popüler" }, { c: 7000, p: 2199.99 },
  { c: 17500, p: 5499.99 }, { c: 35000, p: 10999.99 }, { custom: true }
];
const RATE = 0.3143; // özel miktar için coin başına ₺
const AMOUNTS = [10, 50, 100, 500, 1000, 5000];

let balance = loadBalance(), selPkg = 0, customCoins = 0, sendAmount = 0;

// Bakiye kalıcı: uygulamada UserDefaults'a, tarayıcıda localStorage'a kaydedilir
function loadBalance() {
  if (Number.isFinite(window.__savedBalance)) return window.__savedBalance;
  try { return Math.max(0, parseInt(localStorage.getItem("coinBalance"), 10) || 0); } catch { return 0; }
}
function saveBalance() {
  try { window.webkit.messageHandlers.coin.postMessage(balance); } catch {}
  try { localStorage.setItem("coinBalance", String(balance)); } catch {}
}
const $ = s => document.querySelector(s);
const tl = n => "₺" + n.toLocaleString("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmt = n => n.toLocaleString("tr-TR");

function renderBalance() { document.querySelectorAll(".bal").forEach(el => el.textContent = fmt(balance)); renderSend(); saveBalance(); }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1800); }

// Sekmeler
function showScreen(id) {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.screen === id));
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === id));
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => showScreen(t.dataset.screen));

// Paketler
function currentPkg() { const p = PACKAGES[selPkg]; return p.custom ? { c: customCoins, p: +(customCoins * RATE).toFixed(2) } : p; }
function renderPackages() {
  $("#packages").innerHTML = PACKAGES.map((p, i) => p.custom
    ? `<button class="pkg custom ${i === selPkg ? "selected" : ""}" data-i="${i}"><div class="amt">${customCoins ? `<span class="coin">C</span>${fmt(customCoins)}` : "Özel"}</div><div class="price">${customCoins ? tl(customCoins * RATE) : "Miktar gir"}</div></button>`
    : `<button class="pkg ${i === selPkg ? "selected" : ""}" data-i="${i}">${p.badge ? `<span class="badge">${p.badge}</span>` : ""}<div class="amt"><span class="coin">C</span>${fmt(p.c)}</div><div class="price">${tl(p.p)}</div></button>`
  ).join("");
  const cur = currentPkg();
  $("#total").textContent = tl(cur.p);
  $("#payBtn").disabled = !cur.c;
}
$("#packages").onclick = e => {
  const b = e.target.closest(".pkg"); if (!b) return;
  selPkg = +b.dataset.i;
  if (PACKAGES[selPkg].custom) openCustom(); else renderPackages();
};
function openCustom() {
  openModal(`<h3>Özel miktar</h3>
    <input class="custom-in" id="customIn" type="number" inputmode="numeric" min="30" max="2500000" placeholder="30 - 2.500.000" value="${customCoins || ""}">
    <div class="row" style="border:0"><span>Tutar</span><span id="customPrice">${tl(customCoins * RATE)}</span></div>
    <button class="btn-primary" id="customOk">Onayla</button><button class="cancel" data-close>Vazgeç</button>`);
  const inp = $("#customIn"); inp.focus();
  inp.oninput = () => $("#customPrice").textContent = tl((+inp.value || 0) * RATE);
  $("#customOk").onclick = () => {
    const v = Math.floor(+inp.value);
    if (v < 30 || v > 2500000) return toast("30 ile 2.500.000 arasında gir");
    customCoins = v; closeModal(); renderPackages();
  };
}

// Ödeme yöntemleri
$("#methods").onclick = e => {
  const m = e.target.closest(".method"); if (!m) return;
  document.querySelectorAll(".method").forEach(x => x.classList.toggle("selected", x === m));
};

// Ödeme onayı
$("#payBtn").onclick = () => {
  const p = currentPkg(); if (!p.c) return;
  const method = $(".method.selected .ml").textContent;
  openModal(`<h3>Siparişi onayla</h3>
    <div class="row"><span>Ürün</span><span>${fmt(p.c)} Coin</span></div>
    <div class="row"><span>Ödeme yöntemi</span><span>${method}</span></div>
    <div class="row"><span>Toplam</span><span><b>${tl(p.p)}</b></span></div>
    <button class="btn-primary" id="confirmPay">${tl(p.p)} öde</button><button class="cancel" data-close>Vazgeç</button>`);
  $("#confirmPay").onclick = () => {
    $("#confirmPay").textContent = "İşleniyor..."; $("#confirmPay").disabled = true;
    setTimeout(() => {
      balance += p.c; renderBalance();
      $("#modal").innerHTML = `<div class="success"><div class="check">✓</div><h3>Coin yüklendi</h3><p class="note">${fmt(p.c)} coin hesabına eklendi</p></div>
        <button class="btn-primary" data-close>Tamam</button>`;
    }, 900);
  };
};

// Modal
function openModal(html) { $("#modal").innerHTML = html; $("#modalBg").classList.add("show"); }
function closeModal() { $("#modalBg").classList.remove("show"); }
$("#modalBg").onclick = e => { if (e.target.id === "modalBg" || e.target.hasAttribute("data-close")) closeModal(); };

// Coin gönder
const recipient = () => $("#recipientIn").value.trim().replace(/^@+/, "");
const esc = s => s.replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
function renderSend() {
  const typed = !!$("#amountIn").value;
  $("#amounts").innerHTML = AMOUNTS.map(a =>
    `<button class="amt-btn ${a === sendAmount && !typed ? "selected" : ""}" data-a="${a}"><span class="coin">C</span>${fmt(a)}</button>`
  ).join("");
  $("#amountBox").classList.toggle("active", typed);
  const u = recipient(), left = balance - sendAmount;
  $("#sendSummary").innerHTML = `
    <div class="row"><span>Alıcı</span><span>${u ? "@" + esc(u) : "—"}</span></div>
    <div class="row"><span>Gönderilecek</span><span><b>${fmt(sendAmount)} coin</b></span></div>
    <div class="row ${left < 0 ? "neg" : ""}"><span>Kalan bakiye</span><span>${fmt(left)} coin</span></div>`;
  $("#sendBtn").textContent = sendAmount ? `${fmt(sendAmount)} coin gönder` : "Gönder";
  $("#sendBtn").disabled = !sendAmount;
}
$("#amounts").onclick = e => {
  const b = e.target.closest(".amt-btn"); if (!b) return;
  $("#amountIn").value = ""; sendAmount = +b.dataset.a; renderSend();
};
$("#amountIn").oninput = () => { sendAmount = Math.max(0, Math.floor(+$("#amountIn").value || 0)); renderSend(); };
$("#recipientIn").oninput = () => { $(".recipient-in").classList.remove("err"); renderSend(); };
$("#goRecharge").onclick = () => showScreen("recharge");

$("#sendBtn").onclick = () => {
  const u = recipient(), amt = sendAmount;
  if (!u) { $(".recipient-in").classList.add("err"); $("#recipientIn").focus(); return toast("Önce kullanıcı adı gir"); }
  if (!amt) return toast("Coin miktarı seç");
  if (amt > balance) {
    openModal(`<h3>Yetersiz bakiye</h3><p class="note" style="text-align:center">${fmt(amt)} coin göndermek için bakiyen yetmiyor. Bakiyen: ${fmt(balance)} coin</p>
      <button class="btn-primary" id="needRecharge">Coin yükle</button><button class="cancel" data-close>Vazgeç</button>`);
    $("#needRecharge").onclick = () => { closeModal(); showScreen("recharge"); };
    return;
  }
  openModal(`<h3>Gönderimi onayla</h3>
    <div class="row"><span>Alıcı</span><span>@${esc(u)}</span></div>
    <div class="row"><span>Miktar</span><span><b>${fmt(amt)} coin</b></span></div>
    <div class="row"><span>Kalan bakiye</span><span>${fmt(balance - amt)} coin</span></div>
    <button class="btn-primary" id="confirmSend">${fmt(amt)} coin gönder</button><button class="cancel" data-close>Vazgeç</button>`);
  $("#confirmSend").onclick = () => {
    $("#confirmSend").textContent = "Gönderiliyor..."; $("#confirmSend").disabled = true;
    setTimeout(() => {
      balance -= amt; renderBalance();
      $("#modal").innerHTML = `<div class="success"><div class="check">✓</div><h3>Gönderildi</h3><p class="note">@${esc(u)} kullanıcısına ${fmt(amt)} coin gönderildi</p></div>
        <button class="btn-primary" data-close>Tamam</button>`;
    }, 800);
  };
};

renderBalance(); renderPackages();
</script>
</body>
</html>
